name: Gerar APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sistema-apk/package-lock.json

      - name: Instalar dependências
        working-directory: sistema-apk
        run: npm ci

      - name: Sincronizar Capacitor
        working-directory: sistema-apk
        run: npx cap sync android

      - name: Compilar APK
        working-directory: sistema-apk/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA-apk
          path: sistema-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
